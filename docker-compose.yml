services:
  db:
    image: mysql:8.0
    container_name: dm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: download_manager
      MYSQL_USER: dm
      MYSQL_PASSWORD: dm123
    ports:
      - "3306:3306"
    volumes:
      - dm-mysql-data:/var/lib/mysql
volumes:
  dm-mysql-data:
