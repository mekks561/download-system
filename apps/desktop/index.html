<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
    <title>DM Download Manager</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f5f5f7;
        color: #1d1d1f;
      }
      .container {
        text-align: center;
        padding: 2rem;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      h1 { margin-bottom: 0.5rem; color: #0066cc; }
      p { color: #86868b; }
      .status {
        margin-top: 1.5rem;
        display: inline-block;
        padding: 0.5rem 1rem;
        border-radius: 20px;
        background: #e1f5fe;
        color: #01579b;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>DM Download Manager</h1>
      <p>正在连接到服务，请稍候...</p>
      <div class="status">Shell v3.1.0-mvp</div>
    </div>
  </body>
</html>
