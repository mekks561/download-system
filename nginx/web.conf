# 主站（apps/web）静态托管 + /api 反向代理
#
# 前端所有请求都走相对路径 `/api`（services/api.ts 与 ApiClient.ts 均以 '/api' 为 baseURL），
# 因此这里把 /api 整体转发给 api 容器，前端无需任何构建期环境变量。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 下载管理器涉及大文件上传，放宽请求体上限（默认 1m 会直接 413）
    client_max_body_size 4096m;
    client_body_timeout 600s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # 带哈希的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不缓存，否则前端发版后用户仍加载旧 chunk 清单
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://dm-api:5001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO 长连接升级（后端 socket.io@4.8.3）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 大文件上传/下载与长任务需要长超时
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    # SPA 路由回退（React Router 的 /downloads、/files 等刷新后不能 404）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
