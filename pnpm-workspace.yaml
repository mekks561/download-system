packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  js-yaml: '>=4.3.2'
  nanoid: ^3.3.18
  qs: '>=6.16.0'
  undici: '>=7.29.1'
  ip-address: '>=10.5.1'
  deepmerge-ts: '>=8.0.0'

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - bufferutil
  - utf-8-validate

# node-datachannel 是 webtorrent 的可选 WebRTC 依赖，发布的 prebuild 不含 musl，
# 在 alpine 上会回退到源码编译（需 cmake）。当前 torrent-engine 已停用 WebTorrent，
# 运行时不加载该模块，故显式跳过其构建脚本。
ignoredBuiltDependencies:
  - node-datachannel
